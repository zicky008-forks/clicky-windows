name: Vietnamese voice check
# Loads offline hearing (sherpa-onnx), Piper and VieNeu in one Windows process, reads three finance
# sentences with each voice and hears them back. Catches an onnxruntime DLL clash and reports speed.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - audio/**
      - tools/giong_noi/**
      - requirements-vieneu.txt
      - .github/workflows/voice-check.yml
jobs:
  voice:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      CLICKY_VOICE_DIR: voice
      CLICKY_MODEL_CACHE: ~/clicky-model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "sherpa-onnx>=2.0.1,<3" sentencepiece numpy PyYAML
      - run: python -m pip install -r requirements-vieneu.txt
      - run: python -m pip install --no-deps vieneu==3.8.3
      # Same cache as the installer build: archives checked against their pinned SHA-256.
      - id: models
        uses: actions/cache/restore@v4
        with:
          path: ~/clicky-model-cache
          key: models-v2-${{ hashFiles('tools/giong_noi/tai_model.py') }}
          restore-keys: models-v2-
      - run: python tools/giong_noi/tai_model.py --model 70k --out voice/asr-vi
      - run: python tools/giong_noi/tai_model.py --model piper-vais1000 --out voice/tts-piper-vi
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/clicky-model-cache
          key: models-v2-${{ hashFiles('tools/giong_noi/tai_model.py') }}
      - run: python tools/giong_noi/tai_vieneu.py --precision both --out voice/vieneu
      - name: Sizes
        shell: pwsh
        run: |
          Get-ChildItem voice -Directory | ForEach-Object {
            "{0}: {1:N0} MB" -f $_.Name, ((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          } | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - name: Hear every voice back
        shell: pwsh
        run: |
          python tools/giong_noi/kiem_tra_giong.py | Tee-Object ket-qua-giong.json
          $code = $LASTEXITCODE
          '```json' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          Get-Content ket-qua-giong.json | Out-File -Append $env:GITHUB_STEP_SUMMARY
          '```' | Out-File -Append $env:GITHUB_STEP_SUMMARY
          exit $code
