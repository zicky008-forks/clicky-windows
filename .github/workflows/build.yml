name: Windows installer build
# Builds the portable folder and Setup-Clicky.exe on a clean Windows runner, so
# testers can download a build without setting up Python. Run it from the
# Actions tab, or it runs when packaging files change in a pull request.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/build.yml
      - build.bat
      - clicky.spec
      - main.py
      - updates.py
      - installer.iss
      - requirements.txt
permissions:
  contents: write        # a v* tag publishes the Velopack release for in-app updates
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [full, bi]
    env:
      CLICKY_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: choco install innosetup --no-progress -y
      - run: .\build.bat installer
        shell: cmd
      - name: Report sizes
        shell: pwsh
        run: |
          $folder = (Get-ChildItem dist\Clicky -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          $setup = (Get-Item dist\Setup-Clicky.exe).Length / 1MB
          "Edition ${{ matrix.edition }}: installer {0:N0} MB, installed folder {1:N0} MB" -f $setup, $folder | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist\Clicky\_internal -Directory | ForEach-Object {
            [pscustomobject]@{ MB = [math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB); Name = $_.Name }
          } | Sort-Object MB -Descending | Select-Object -First 15 | Format-Table -AutoSize | Out-String
      - uses: actions/upload-artifact@v4
        with:
          name: Setup-Clicky-${{ matrix.edition }}
          path: dist/Setup-Clicky.exe
          if-no-files-found: error
          retention-days: 14
      # The BI edition installs and updates with Velopack: per-user, no admin,
      # and later versions download only the changed files.
      - name: Velopack package
        if: matrix.edition == 'bi'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vpk = python -c "import importlib.metadata as m; print(m.version('velopack'))"
          dotnet tool install -g vpk --version $vpk
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $base = (Select-String -Path updates.py -Pattern "^VERSION='([^']+)'").Matches[0].Groups[1].Value
            $version = "$base.ci${{ github.run_number }}"
          }
          $repo = "https://github.com/${{ github.repository }}"
          # The previous release lets vpk build a delta; the first release has none.
          vpk download github --repoUrl $repo --token $env:GH_TOKEN --outputDir releases
          vpk pack --packId ClickyBI --packTitle "Clicky BI" --packVersion $version --packDir dist\Clicky --mainExe Clicky.exe --runtime win-x64 --outputDir releases
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem releases | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ('${{ github.ref_type }}' -eq 'tag') {
            vpk upload github --repoUrl $repo --token $env:GH_TOKEN --outputDir releases --tag '${{ github.ref_name }}' --releaseName "Clicky BI $version" --publish --merge
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: matrix.edition == 'bi'
        with:
          name: Clicky-BI-Setup
          path: releases/*-Setup.exe
          if-no-files-found: error
          retention-days: 14
