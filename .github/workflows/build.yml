name: Windows installer build
# Builds the portable folder and Setup-Clicky.exe on a clean Windows runner, so
# testers can download a build without setting up Python. Run it from the
# Actions tab, or it runs when packaging files change in a pull request.
on:
  workflow_dispatch:
    inputs:
      vieneu:
        description: Bundle the VieNeu v3 offline voice
        type: boolean
        default: false
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/build.yml
      - build.bat
      - clicky.spec
      - main.py
      - updates.py
      - installer.iss
      - requirements.txt
      - tools/giong_noi/tai_model.py
      - tools/giong_noi/tai_vieneu.py
      - requirements-vieneu.txt
permissions:
  contents: write        # a v* tag publishes the Velopack release for in-app updates
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [full, bi]
    env:
      CLICKY_EDITION: ${{ matrix.edition }}
      CLICKY_MODEL_CACHE: ~/clicky-model-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller sentencepiece
      # Model archives kept between runs: upstream release downloads sometimes answer 504 for hours.
      # Each archive is still checked against its pinned SHA-256, so an older cache is safe to restore.
      - id: models
        uses: actions/cache/restore@v4
        with:
          path: ~/clicky-model-cache
          key: models-v2-${{ hashFiles('tools/giong_noi/tai_model.py') }}
          restore-keys: models-v2-
      # Offline Vietnamese speech (~75 MB, Apache-2.0 weights), checked by SHA-256, bundled as voice/asr-vi.
      - run: python tools/giong_noi/tai_model.py --model 70k --out voice/asr-vi
      # Offline Vietnamese voice (Piper vais1000 through sherpa-onnx, ~63 MB, no espeak-ng).
      - run: python tools/giong_noi/tai_model.py --model piper-vais1000 --out voice/tts-piper-vi
      # Saved right after the downloads, so a later failing step still keeps them for the next run.
      - if: steps.models.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/clicky-model-cache
          key: models-v2-${{ hashFiles('tools/giong_noi/tai_model.py') }}
      # VieNeu v3 (offline voice, Apache-2.0) without gradio/librosa/torch. Off until the blind listening
      # test picks it: run the workflow by hand with vieneu=true, or set the repo variable CLICKY_VIENEU=1.
      - name: VieNeu voice
        if: inputs.vieneu == true || vars.CLICKY_VIENEU == '1'
        run: |
          python -m pip install -r requirements-vieneu.txt
          python -m pip install --no-deps vieneu==3.8.3
          python tools/giong_noi/tai_vieneu.py --precision both --out voice/vieneu
      - run: choco install innosetup --no-progress -y
      - run: .\build.bat installer
        shell: cmd
      - name: Report sizes
        shell: pwsh
        run: |
          $folder = (Get-ChildItem dist\Clicky -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          $setup = (Get-Item dist\Setup-Clicky.exe).Length / 1MB
          "Edition ${{ matrix.edition }}: installer {0:N0} MB, installed folder {1:N0} MB" -f $setup, $folder | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          Get-ChildItem dist\Clicky\_internal -Directory | ForEach-Object {
            [pscustomobject]@{ MB = [math]::Round((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB); Name = $_.Name }
          } | Sort-Object MB -Descending | Select-Object -First 15 | Format-Table -AutoSize | Out-String
      - uses: actions/upload-artifact@v4
        with:
          name: Setup-Clicky-${{ matrix.edition }}
          path: dist/Setup-Clicky.exe
          if-no-files-found: error
          retention-days: 14
      # The BI edition installs and updates with Velopack: per-user, no admin,
      # and later versions download only the changed files.
      - name: Velopack package
        if: matrix.edition == 'bi'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $vpk = python -c "import importlib.metadata as m; print(m.version('velopack'))"
          dotnet tool install -g vpk --version $vpk
          if ('${{ github.ref_type }}' -eq 'tag') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $base = (Select-String -Path updates.py -Pattern "^VERSION='([^']+)'").Matches[0].Groups[1].Value
            $version = "$base.ci${{ github.run_number }}"
          }
          $repo = "https://github.com/${{ github.repository }}"
          # The previous release lets vpk build a delta; the first release has none.
          vpk download github --repoUrl $repo --token $env:GH_TOKEN --outputDir releases
          # Release notes in plain Vietnamese: the first line is what Clicky says after a quiet update (updates.first_note).
          $notes = @()
          $base = $version -replace '-.*$', ''
          if (Test-Path "docs\phat-hanh\$base.md") { $notes = @('--releaseNotes', "docs\phat-hanh\$base.md") }
          vpk pack --packId ClickyBI --packTitle "Clicky BI" --packVersion $version --packDir dist\Clicky --mainExe Clicky.exe --runtime win-x64 --outputDir releases @notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem releases | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) } | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ('${{ github.ref_type }}' -eq 'tag') {
            vpk upload github --repoUrl $repo --token $env:GH_TOKEN --outputDir releases --tag '${{ github.ref_name }}' --releaseName "Clicky BI $version" --publish --merge
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: matrix.edition == 'bi'
        with:
          name: Clicky-BI-Setup
          path: releases/*-Setup.exe
          if-no-files-found: error
          retention-days: 14
