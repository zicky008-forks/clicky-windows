name: Windows installer build
# Builds the portable folder and Setup-Clicky.exe on a clean Windows runner, so
# testers can download a build without setting up Python. Run it from the
# Actions tab, or it runs when packaging files change in a pull request.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/build.yml
      - build.bat
      - clicky.spec
      - installer.iss
      - requirements.txt
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: choco install innosetup --no-progress -y
      - run: .\build.bat installer
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Setup-Clicky
          path: dist/Setup-Clicky.exe
          if-no-files-found: error
          retention-days: 14
